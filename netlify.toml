# Meekon Displays — configurazione Netlify
# Nessun segreto qui: le chiavi sono variabili d'ambiente impostate su Netlify.

[build]
  publish = "."
  # Le pagine sono generate da build.py (solo libreria standard di Python).
  # Su Netlify, se SUPABASE_URL e SUPABASE_ANON_KEY sono disponibili anche
  # nell'ambiente di BUILD (scope "Builds"), build.py legge i contenuti
  # pubblicati dal CMS (scripts/cms_fetch.py) e copia i media in /assets/media/.
  # La build parte anche dal build hook chiamato da /api/pubblica.
  command = "python3 build.py"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Dominio principale: meekondisplay.ch (www → apex lo fa già Netlify).
# Il vecchio indirizzo .netlify.app rimanda al dominio, così Google vede un solo sito.
# ---------------------------------------------------------------------
[[redirects]]
  from = "https://meekondisplay.netlify.app/*"
  to = "https://meekondisplay.ch/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------
# File interni del repository: mai serviti dal sito (publish = ".")
# ---------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

