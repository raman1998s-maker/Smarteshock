# Meekon Displays — configurazione Netlify
# Nessun segreto qui: le chiavi sono variabili d'ambiente impostate su Netlify.

[build]
  publish = "."
  # Le pagine HTML sono generate in locale con `python3 build.py` e committate.

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# File interni del repository: mai serviti dal sito (publish = ".")
# ---------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

