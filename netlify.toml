# Area riservata: mai indicizzata, mai in cache
[[headers]]
  for = "/area-riservata"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/area-riservata/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Pagina pubblica di accettazione delle offerte (link segreto): mai indicizzata, mai in cache
[[headers]]
  for = "/offerta/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# API (le functions impostano gli stessi header anche nelle loro risposte)
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Risorse statiche: cache lunga.
# Immagini e video cambiano raramente → 1 anno. CSS e JS non hanno l'hash nel
# nome del file, quindi cache più corta (1 giorno + rivalidazione) per non
# servire versioni vecchie dopo un aggiornamento.
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
