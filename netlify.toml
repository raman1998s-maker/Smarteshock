# ---------------------------------------------------------------------
# Header di sicurezza per tutti i percorsi, CSP compresa (sicura per default)
# ---------------------------------------------------------------------
# CSP di "/*" = CSP dell'area riservata: come la pubblica, in più l'host di
# Supabase per
#  - connect-src: caricamento dei file con URL firmato (PUT) e lettura anteprime;
#  - img-src / media-src: anteprime con URL firmato (5 min) + blob: per le
#    anteprime locali prima del caricamento.
# Sta su "/*" perché nessun percorso resti mai senza CSP (404 per URL
# sconosciuti, rewrite 404 delle cartelle interne, pagine future dimenticate).
# Sui percorsi pubblici elencati più sotto Netlify aggiunge anche la CSP
# pubblica: il browser applica entrambe, l'intersezione è la CSP pubblica.
# DA FARE al collegamento del progetto Supabase (UE Francoforte): sostituire
# "https://*.supabase.co" con l'host esatto, es. "https://abcdefghijklmnop.supabase.co"
# (stesso valore di SUPABASE_URL; netlify.toml non può leggere variabili
# d'ambiente). Il wildcard ammetterebbe qualsiasi progetto Supabase come destinazione.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------------
# Content-Security-Policy pubblica (solo 'self')
# Si somma alla CSP di "/*": se un percorso corrisponde a più regole Netlify
# le applica tutte e il browser applica l'intersezione delle CSP, cioè
# questa. Una pagina pubblica nuova non elencata qui ha comunque la CSP di
# "/*" (mai senza CSP), ma va aggiunta qui per avere quella stretta.
# L'area riservata NON va elencata qui (non potrebbe contattare Supabase).
# (Le risposte /api/* hanno una CSP propria impostata dalle functions.)
# ---------------------------------------------------------------------
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

