<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scegliete la password — Area riservata Meekon Displays</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#08090B">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261126">
  <script src="/area-riservata/i18n-de.js" defer></script>
  <script src="/area-riservata/i18n-en.js" defer></script>
  <script src="/area-riservata/i18n.js" defer></script>
  <script src="/area-riservata/password.js" defer></script>
</head>
<body class="login-page">
  <main class="login">
    <img src="/assets/img/logo.png" alt="Meekon Displays" width="595" height="246">
    <div>
      <h1>Benvenuti</h1>
      <p>Scegliete la vostra password per l'area riservata di Meekon Displays.</p>
    </div>
    <noscript><p class="alert alert--error">Per usare l'area riservata è necessario attivare JavaScript nel browser.</p></noscript>
    <p class="alert alert--error" id="pw-error" role="alert" hidden></p>
    <p class="alert alert--ok" id="pw-ok" role="status" hidden>Password salvata. Ora potete accedere con la vostra e-mail e la nuova password.</p>
    <form id="pw-form" method="post" action="/api/auth/password" novalidate>
      <div class="field">
        <label for="pw1">Nuova password</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <p class="field__hint">Almeno 10 caratteri.</p>
      </div>
      <div class="field">
        <label for="pw2">Ripetete la password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      </div>
      <button class="btn btn--primary" type="submit">Salva la password</button>
    </form>
    <p><a href="/area-riservata/" id="pw-login" hidden>Vai all'accesso</a></p>
  </main>
</body>
</html>
